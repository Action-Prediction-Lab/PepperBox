name: Publish image

on:
  push:
    tags: ['v*']
  public:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/action-prediction-lab/pepper-box

jobs:
  publish-tag:
    if: |
      github.event_name == 'push' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backfill:
    if: github.event_name == 'public' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push each existing v* tag
        run: |
          set -euo pipefail
          tags=$(git tag --list 'v*' --sort=creatordate)
          if [[ -z "$tags" ]]; then
            echo "No v* tags found, nothing to backfill."
            exit 0
          fi
          for tag in $tags; do
            echo "::group::$tag"
            git checkout "$tag"
            # Only "manifest unknown" means unpublished; any other registry error stops the job rather than risk overwriting a tag.
            if inspect=$(docker manifest inspect "$IMAGE:$tag" 2>&1); then
              echo "$IMAGE:$tag is published, skipped"
            elif grep -q "manifest unknown" <<<"$inspect"; then
              docker build -t "$IMAGE:$tag" .
              docker push "$IMAGE:$tag"
            else
              echo "$inspect" >&2
              exit 1
            fi
            echo "::endgroup::"
          done
          # latest points at the newest tag without a hyphen, so a pre-release never becomes latest.
          latest=$(echo "$tags" | { grep -v -- '-' || true; } | tail -1)
          if [[ -z "$latest" ]]; then
            echo "No release tag without a hyphen, latest left unchanged."
            exit 0
          fi
          docker pull "$IMAGE:$latest"
          docker tag "$IMAGE:$latest" "$IMAGE:latest"
          docker push "$IMAGE:latest"
